apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itinera.fullname" . }}-review
  labels:
    {{- include "itinera.review.labels" . | nindent 4 }}
spec:
  {{- if not .Values.review.autoscaling.enabled }}
  replicas: {{ .Values.review.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "itinera.review.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.review.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "itinera.review.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.review.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "itinera.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.review.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env: 
          - name: PROFILE_URL
            value: {{.Values.global.profileUrl}}
          - name: SEARCH_URL
            value: {{.Values.global.searchUrl}}
          - name: RANKING_URL
            value: {{ include "itinera.fullname" . }}-ranking:{{.Values.ranking.service.port}}
          - name: PHOTO_URL
            value: {{.Values.global.photoUrl}}
          - name: DB_USER
            value: {{.Values.global.db.user}}
          - name: DB_NAME
            value: {{.Values.global.db.name}}
          - name: DB_PASSWORD
            value: {{.Values.global.db.password}}
          - name: DB_HOST
            value: {{.Values.global.db.host}}
          - name: DB_PORT  
            value: "{{.Values.global.db.port}}"
          securityContext:
            {{- toYaml .Values.review.securityContext | nindent 12 }}
          image: "{{ .Values.review.image.repository }}:{{ .Values.review.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.review.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.review.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.review.resources | nindent 12 }}
      {{- with .Values.review.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.review.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.review.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
