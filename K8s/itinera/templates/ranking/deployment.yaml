apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itinera.fullname" . }}-ranking
  labels:
    {{- include "itinera.ranking.labels" . | nindent 4 }}
spec:
  {{- if not .Values.ranking.autoscaling.enabled }}
  replicas: {{ .Values.ranking.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "itinera.ranking.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.ranking.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "itinera.ranking.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.ranking.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "itinera.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ranking.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env: 
          - name: SEARCH_URL
            value: {{.Values.global.searchUrl}}
          - name: REVIEW_URL
            value: {{ include "itinera.fullname" . }}-review:{{.Values.review.service.port}}
          - name: PHOTO_URL
            value: {{.Values.global.photoUrl}}
          - name: PROFILE_URL
            value: {{.Values.global.profileUrl}}
          - name: DB_USER
            value: {{.Values.global.db.user}}
          - name: DB_NAME
            value: {{.Values.global.db.name}}
          - name: DB_PASSWORD
            value: {{.Values.global.db.password}}
          - name: DB_HOST
            value: {{.Values.global.db.host}}
          - name: DB_PORT  
            value: "{{.Values.global.db.port}}"
          securityContext:
            {{- toYaml .Values.ranking.securityContext | nindent 12 }}
          image: "{{ .Values.ranking.image.repository }}:{{ .Values.ranking.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ranking.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ranking.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.ranking.resources | nindent 12 }}
      {{- with .Values.ranking.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ranking.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ranking.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
